org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configureondemand=true
android.useAndroidX=true
kotlin.code.style=official

# This sandbox is aarch64 but the Android SDK's bundled aapt2 (build-tools) is x86-64 only,
# so it can't execute here. Termux ships a native aarch64 aapt2 that works under this proot
# setup; point AGP at it instead of the Maven-resolved one.
# NOTE: this path only exists in this Termux/proot-distro sandbox. On a normal dev machine
# or CI, delete this line (or override it with an empty value) so AGP uses its own aapt2.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
